<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 한 줄 조언</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

    </div>
</body>
</html>
